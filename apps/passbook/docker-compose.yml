services:
  app:
    build:
      context: ../..
      dockerfile: apps/passbook/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - passbook-data:/data
      - ${PASSBOOK_BACKUP_DIR:-passbook-backups}:/backups
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.passbook.rule=Host(`passbook.tools.local`)
      - traefik.http.routers.passbook.entrypoints=web
      - traefik.http.routers.passbook-secure.rule=Host(`passbook.tools.local`)
      - traefik.http.routers.passbook-secure.entrypoints=websecure
      - traefik.http.routers.passbook-secure.tls=true
      - traefik.http.services.passbook.loadbalancer.server.port=3000

networks:
  web:
    external: true

volumes:
  passbook-data:
    name: passbook-data
  passbook-backups:
    name: passbook-backups

services:
  app:
    build:
      context: ../..
      dockerfile: apps/tenure/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - tenure-data:/data
      - ${TENURE_BACKUP_DIR:-tenure-backups}:/backups
    networks:
      web:
        aliases:
          - tenure.internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.tenure.rule=Host(`tenure.tools.local`)
      - traefik.http.routers.tenure.entrypoints=web
      - traefik.http.routers.tenure-secure.rule=Host(`tenure.tools.local`)
      - traefik.http.routers.tenure-secure.entrypoints=websecure
      - traefik.http.routers.tenure-secure.tls=true
      - traefik.http.services.tenure.loadbalancer.server.port=3000

networks:
  web:
    external: true

volumes:
  tenure-data:
    name: tenure-data
  tenure-backups:
    name: tenure-backups

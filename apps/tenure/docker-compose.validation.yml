# Disposable override for Phase 7 deployment isolation checks.
# Never use with production project names or without inspecting `docker compose config` first.
#
#   docker compose -p yt-validation-tenure \
#     -f docker-compose.yml -f docker-compose.validation.yml config
#   docker compose -p yt-validation-tenure \
#     -f docker-compose.yml -f docker-compose.validation.yml up -d --build
#
# Tear down with `docker compose -p yt-validation-tenure ... down` (add `-v` only for disposable volumes).

services:
  app:
    labels: !reset []

networks:
  web:
    name: yt-validation-tenure-net
    external: false

volumes:
  tenure-data:
    name: yt-validation-tenure-data
  tenure-backups:
    name: yt-validation-tenure-backups

services:
  app:
    build:
      context: ../..
      dockerfile: apps/taxbook/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - taxbook-data:/data
      - ${TAXBOOK_BACKUP_DIR:-taxbook-backups}:/backups
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.taxbook.rule=Host(`taxbook.tools.local`)
      - traefik.http.routers.taxbook.entrypoints=web
      - traefik.http.routers.taxbook-secure.rule=Host(`taxbook.tools.local`)
      - traefik.http.routers.taxbook-secure.entrypoints=websecure
      - traefik.http.routers.taxbook-secure.tls=true
      - traefik.http.services.taxbook.loadbalancer.server.port=3000

networks:
  web:
    external: true

volumes:
  taxbook-data:
    name: taxbook-data
  taxbook-backups:
    name: taxbook-backups

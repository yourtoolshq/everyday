# Disposable override for Phase 7 deployment isolation checks.
# Never use with production project names or without inspecting `docker compose config` first.
#
#   docker compose -p yt-validation-roof \
#     -f docker-compose.yml -f docker-compose.validation.yml config
#   docker compose -p yt-validation-roof \
#     -f docker-compose.yml -f docker-compose.validation.yml up -d --build
#
# Tear down with `docker compose -p yt-validation-roof ... down` (add `-v` only for disposable volumes).

services:
  app:
    labels: !reset []

networks:
  web:
    name: yt-validation-roof-net
    external: false

volumes:
  roof-data:
    name: yt-validation-roof-data
  roof-backups:
    name: yt-validation-roof-backups

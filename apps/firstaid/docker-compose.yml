services:
  app:
    build:
      context: ../..
      dockerfile: apps/firstaid/Dockerfile
    environment:
      DATABASE_URL: file:/data/firstaid.db
      DOCUMENTS_DIR: /data/documents
      NODE_ENV: production
    ports:
      - "127.0.0.1:${FIRSTAID_PORT:-3001}:3000"
    restart: unless-stopped
    volumes:
      - firstaid-data:/data

volumes:
  firstaid-data:
    name: firstaid-data

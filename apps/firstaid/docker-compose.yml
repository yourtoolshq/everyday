services:
  app:
    build:
      context: ../..
      dockerfile: apps/firstaid/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - firstaid-data:/data
      - ${FIRSTAID_BACKUP_DIR:-firstaid-backups}:/backups
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.firstaid.rule=Host(`firstaid.tools.local`)
      - traefik.http.routers.firstaid.entrypoints=web
      - traefik.http.routers.firstaid-secure.rule=Host(`firstaid.tools.local`)
      - traefik.http.routers.firstaid-secure.entrypoints=websecure
      - traefik.http.routers.firstaid-secure.tls=true
      - traefik.http.services.firstaid.loadbalancer.server.port=3000

networks:
  web:
    external: true

volumes:
  firstaid-data:
    name: firstaid-data
  firstaid-backups:
    name: firstaid-backups

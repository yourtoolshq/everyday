name: passbook release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-linux:
    name: package linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build Passbook release artifacts
        run: pnpm package:passbook:linux
        env:
          APP_VERSION: ${{ inputs.version }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: passbook-linux-${{ inputs.version }}
          path: apps/passbook/desktop/release/*.AppImage
          if-no-files-found: error

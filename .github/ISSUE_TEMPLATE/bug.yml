name: Bug report
description: Report incorrect or broken behavior
title: "[bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: app
    attributes:
      label: Application
      options:
        - taxbook
        - firstaid
        - passbook
        - tenure
        - platform
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
